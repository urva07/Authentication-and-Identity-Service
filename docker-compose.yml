services:
  app:
    build: .
    init: true
    stop_grace_period: 40s
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      environment: development
      PORT: 3000
      HEALTH_APP_PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SESSION_REDIS_HOST: redis_session
      SESSION_REDIS_PORT: 6379
      SESSION_REDIS_USERNAME: ${REDIS_USERNAME:-app}
      SESSION_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      USER_CACHE_REDIS_HOST: redis_user_cache
      USER_CACHE_REDIS_PORT: 6379
      USER_CACHE_REDIS_USERNAME: ${REDIS_USERNAME:-app}
      USER_CACHE_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      RATE_LIMIT_REDIS_HOST: redis_rate_limit
      RATE_LIMIT_REDIS_PORT: 6379
      RATE_LIMIT_REDIS_USERNAME: ${REDIS_USERNAME:-app}
      RATE_LIMIT_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis_session:
        condition: service_healthy
      redis_user_cache:
        condition: service_healthy
      redis_rate_limit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/startup').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    command: ["npm", "run", "dev"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ***REMOVED***
      MYSQL_PASSWORD: ***REMOVED***
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis_session:
    image: redis:7-alpine
    environment:
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --user
      - default
      - off
      - --user
      - ${REDIS_USERNAME:-app}
      - on
      - ">${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      - "~*"
      - "+@all"
    volumes:
      - ./conf/redis/sessionCache.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_session_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_user_cache:
    image: redis:7-alpine
    environment:
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --user
      - default
      - off
      - --user
      - ${REDIS_USERNAME:-app}
      - on
      - ">${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      - "~*"
      - "+@all"
    volumes:
      - ./conf/redis/userCache.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_user_cache_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_rate_limit:
    image: redis:7-alpine
    environment:
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --user
      - default
      - off
      - --user
      - ${REDIS_USERNAME:-app}
      - on
      - ">${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      - "~*"
      - "+@all"
    volumes:
      - ./conf/redis/rateLimiter.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_rate_limit_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # monitoring services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./conf/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./conf/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mysql_data:
  redis_session_data:
  redis_user_cache_data:
  redis_rate_limit_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data: