services:
  server:
    build: ./auth_service
    container_name: auth_service_server
    init: true
    stop_grace_period: 40s
    env_file:
      - ./auth_service/.env
      - ./.env.database
      - ./.env.monitoring
    volumes:
      - ./Auth_Service:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis_session:
        condition: service_healthy
      redis_user_cache:
        condition: service_healthy
      redis_rate_limit:
        condition: service_healthy
      redis_bullMQ:
        condition: service_healthy
      redis_bullMQ:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/startup').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    command: ["npm", "run", "dev"]

  mail_service:
    build: ./mail_service
    container_name: mail_service_server
    init: true
    stop_grace_period: 40s
    env_file:
      - ./mail_service/.env
      - ./.env.database
    volumes:
      - ./Mail_Service:/app
      - /app/node_modules
    depends_on:
      redis_bullMQ:
        condition: service_healthy
    environment:
      environment: development
      PORT: 3002
    restart: unless-stopped
    command: ["npm", "run", "dev"]

  mysql:
    image: mysql:8.4
    container_name: auth_service_db_mysql
    env_file:
      - ./.env.database
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis_session:
    image: redis:7-alpine
    container_name: auth_service_db_redis_session
    env_file:
      - ./.env.database
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf --user default off --user "$${REDIS_USERNAME:-app}" on ">$${REDIS_PASSWORD}" "~*" "+@all"'
    volumes:
      - ./conf/redis/sessionCache.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_session_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_user_cache:
    image: redis:7-alpine
    container_name: auth_service_db_redis_user_cache
    env_file:
      - ./.env.database
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf --user default off --user "$${REDIS_USERNAME:-app}" on ">$${REDIS_PASSWORD}" "~*" "+@all"'
    volumes:
      - ./conf/redis/userCache.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_user_cache_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_rate_limit:
    image: redis:7-alpine
    container_name: auth_service_db_redis_rate_limit
    env_file:
      - ./.env.database
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf --user default off --user "$${REDIS_USERNAME:-app}" on ">$${REDIS_PASSWORD}" "~*" "+@all"'
    volumes:
      - ./conf/redis/rateLimiter.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_rate_limit_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  
  redis_bullMQ:
    image: redis:7-alpine
    container_name: auth_service_db_redis_bullMQ
    env_file:
      - ./.env.database
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf --user default off --user "$${REDIS_USERNAME:-app}" on ">$${REDIS_PASSWORD}" "~*" "+@all"'
    ports:
      - "6379:6379"
    volumes:
      - ./conf/redis/bullMQ.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_bullMQ_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user "$$REDIS_USERNAME" --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # monitoring services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    env_file:
      - ./.env.monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./conf/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - ./.env.monitoring
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    env_file:
      - ./.env.monitoring
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    env_file:
      - ./.env.monitoring
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./conf/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mysql_data:
  redis_session_data:
  redis_user_cache_data:
  redis_rate_limit_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  redis_bullMQ_data: