<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Password reset</title>
    </head>
    <body style="margin: 0; padding: 24px; font-family: Arial, sans-serif; color: #222;">
        <main style="max-width: 560px; margin: 0 auto;">
            <h1 style="font-size: 24px;">Reset your password</h1>
            <p>Hello <%= userName %>,</p>
            <p>
                Use the URL below to continue resetting your password:
            </p>
            <p style="padding: 16px; background: #f3f4f6; font-size: 20px; font-weight: bold; letter-spacing: 2px; text-align: center;">
                <%= resetUrl %>
            </p>
            <p>
                If you did not request a password reset, you can ignore this
                email.
            </p>
        </main>
    </body>
</html>
